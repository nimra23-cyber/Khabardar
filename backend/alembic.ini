# Alembic configuration for KHABARDAR.
# The migration environment (alembic/env.py) and versions are added in Phase 2
# (task 2.1). This file establishes the Alembic entrypoint for the scaffold.

[alembic]
script_location = alembic
prepend_sys_path = .

# The database URL is supplied at runtime from app.core.config (env-based),
# so no secret or connection string is hardcoded here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
